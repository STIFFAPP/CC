<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eden Ground Maintenance Advertising</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid #283451;background:#10172a}header a{color:var(--m);text-decoration:none}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><header><a href="../../index.html">← Confidence Hub</a><h1>🌿 Eden Ground Maintenance Advertising</h1><p>12 weeks to build a repeatable local advertising system for Eden Ground Maintenance, from positioning and proof to enquiries, follow-up and referrals.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and can be included in your Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "Offer & Ideal Customer", "time": "45 min \u00d7 3", "objective": "Define who Eden most wants to serve and what problem the business solves best.", "practice": "List current services; choose 2\u20133 priority customer types; write one clear value proposition for each."}, {"n": 2, "title": "Local Positioning", "time": "40 min \u00d7 3", "objective": "Make Eden easy to understand and remember in the local market.", "practice": "Write a 10-word promise, 30-second introduction and three reasons a customer should enquire."}, {"n": 3, "title": "Proof & Before/After Content", "time": "45 min \u00d7 3", "objective": "Turn completed work into trust-building marketing assets.", "practice": "Create a photo checklist; collect permission; prepare three before/after posts with job context and outcome."}, {"n": 4, "title": "Google & Local Search", "time": "45 min \u00d7 3", "objective": "Improve local discoverability and consistency of business information.", "practice": "Audit business name/contact/service-area details; list priority services and locations; create a review-request process."}, {"n": 5, "title": "Website Conversion", "time": "50 min \u00d7 3", "objective": "Make the website turn visitors into enquiries rather than just describe the company.", "practice": "Audit headline, services, proof, calls-to-action and contact friction; write one stronger enquiry CTA."}, {"n": 6, "title": "Social Content System", "time": "40 min \u00d7 3", "objective": "Create useful local content without needing to post constantly.", "practice": "Build four content pillars: transformations, tips, behind-the-scenes, customer proof; batch six posts."}, {"n": 7, "title": "Leaflets & Local Offline Ads", "time": "45 min \u00d7 3", "objective": "Use offline advertising selectively around areas where Eden wants more work.", "practice": "Draft one simple leaflet: problem, service, proof, CTA; choose a small test area and tracking code/phone note."}, {"n": 8, "title": "Paid Ad Fundamentals", "time": "45 min \u00d7 3", "objective": "Learn offer, audience, creative, landing page and tracking before spending heavily.", "practice": "Draft two ad concepts and one landing-page message; set a test budget ceiling before launch."}, {"n": 9, "title": "Commercial Outreach", "time": "45 min \u00d7 3", "objective": "Build a respectful prospecting process for property managers, landlords or local organisations if they fit Eden\u2019s services.", "practice": "Create a 25-prospect list; write a short personalised introduction; schedule follow-ups without spam."}, {"n": 10, "title": "Enquiry & Follow-Up", "time": "35 min \u00d7 4", "objective": "Improve the percentage of enquiries that become quotes and booked work.", "practice": "Create response template, qualification questions, quote follow-up at sensible intervals and lost-lead reason tracking."}, {"n": 11, "title": "Reviews, Referrals & Repeat Work", "time": "40 min \u00d7 3", "objective": "Turn good work into reputation and recurring demand.", "practice": "Create review request, referral prompt and seasonal/repeat-maintenance reminder."}, {"n": 12, "title": "90-Day Advertising Engine", "time": "60 min \u00d7 2", "objective": "Combine the strongest channels into a measured system.", "practice": "Choose 2\u20133 channels; set weekly actions; track enquiries, source, quotes, wins, revenue and cost; review monthly."}]; const KEY='plan_eden-advertising_done'; let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}
function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
