<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Storytelling</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.hubhome{position:fixed;z-index:999;top:12px;left:12px;padding:10px 14px;border-radius:999px;background:#151d33ee;border:1px solid #344264;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 30px #0007}header{padding:76px 20px 28px;border-bottom:1px solid #283451;background:#10172a}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px;line-height:1.55}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><a class="hubhome" href="../../index.html">← 🏠 Hub</a><header><h1>🎬 YouTube Storytelling</h1><p>12 weeks to learn hooks, story structure, scripting, pacing, retention and emotionally engaging YouTube stories.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and included in Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "Story Before Gear", "time": "45\u201360 min, 3x/week", "objective": "Understand why viewers stay for change, tension and payoff\u2014not just information.", "practice": "Analyse 3 videos: write the promise, conflict, turning point and payoff. Record a 60-second story with beginning, change and ending."}, {"n": 2, "title": "Hooks & The Story Promise", "time": "45\u201360 min, 3x/week", "objective": "Open with a clear reason to care while accurately promising what the video will deliver.", "practice": "Write 20 hooks using curiosity, stakes, contrast and a specific promise. Film 5 versions of the strongest hook and choose the clearest."}, {"n": 3, "title": "Beginning, Middle, End", "time": "60 min, 3x/week", "objective": "Build a simple narrative spine: setup \u2192 pursuit \u2192 complication \u2192 resolution.", "practice": "Outline 3 video ideas in four beats. Turn one into a 2\u20133 minute story without writing every word."}, {"n": 4, "title": "Character, Want & Stakes", "time": "60 min, 3x/week", "objective": "Make the audience understand who wants what, why it matters and what could be lost.", "practice": "For 5 ideas write: character, want, obstacle, stakes. Film one story where the stakes are established in the first 30 seconds."}, {"n": 5, "title": "Curiosity & Open Loops", "time": "45\u201360 min, 3x/week", "objective": "Create unanswered questions that pull viewers forward without misleading them.", "practice": "Add 3 legitimate open loops to a script. Pay each one off. Remove any tease that the video cannot satisfy."}, {"n": 6, "title": "Scripting That Sounds Human", "time": "60\u201375 min, 3x/week", "objective": "Write for speech, not essays, while keeping structure tight.", "practice": "Write a 3-minute script; cut 20%; replace formal phrases with spoken language; record it twice\u2014scripted and bullet-point\u2014and compare."}, {"n": 7, "title": "Scenes, Specifics & Show-Don\u2019t-Tell", "time": "60\u201390 min, 3x/week", "objective": "Turn abstract explanations into concrete scenes, moments and sensory detail.", "practice": "Rewrite 10 generic statements as visible moments. Build a shot/story list for one real event and capture the evidence."}, {"n": 8, "title": "Pacing & Pattern Changes", "time": "60 min, 3x/week", "objective": "Control speed with sentence length, scene duration, questions, silence and visual changes.", "practice": "Mark a script every 15\u201330 seconds for a meaningful change. Edit a 2-minute sequence in fast and slow versions and compare."}, {"n": 9, "title": "Emotion Without Forcing It", "time": "60 min, 3x/week", "objective": "Use honesty, vulnerability, anticipation and consequence rather than manufactured drama.", "practice": "Tell one setback story: expectation \u2192 problem \u2192 internal reaction \u2192 decision \u2192 result \u2192 lesson. Keep the language understated."}, {"n": 10, "title": "Retention & Rewriting", "time": "60\u201390 min, 2\u20133x/week", "objective": "Use audience behaviour as feedback on structure instead of chasing tricks.", "practice": "Review retention on an existing upload if available. Identify likely confusion/drag points. Rewrite the first 60 seconds and one weak middle section."}, {"n": 11, "title": "Title, Thumbnail & Story Alignment", "time": "60 min, 3x/week", "objective": "Make packaging create the right question and ensure the video answers it.", "practice": "Create 10 title ideas and 5 thumbnail concepts for one story. State the viewer expectation each creates and reject mismatched promises."}, {"n": 12, "title": "Capstone: Publish a Complete Story", "time": "2\u20134 hrs across week", "objective": "Combine hook, character, stakes, scenes, pacing and payoff into one finished YouTube story.", "practice": "Plan, film and edit a 5\u201310 minute story-led video. Before publishing, score clarity, hook, stakes, progression, payoff and honesty; then write 3 lessons for the next video."}];const KEY='plan_youtube-storytelling_done';let done=JSON.parse(localStorage.getItem(KEY)||'{}');function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
