function loadSettings(){
  try{

      ...DEFAULT_SETTINGS,
      ...saved,
      phaseDescriptions:{...DEFAULT_SETTINGS.phaseDescriptions,...(saved.phaseDescriptions||{})},
      resourceOverrides:{...(saved.resourceOverrides||{})}
    };
  }catch(e){return structuredClone(DEFAULT_SETTINGS)}

function resourceKey(r,type){return `${type}:${r.folder||''}:${r.startIndex??0}:${r.title||''}`}
function resourceDisplay(r,type){
  const o=SETTINGS.resourceOverrides[resourceKey(r,type)]||{};

}

 currentPage='phases'; phase=n; lesson=null;

}

 } else if(section==='phases'){
   body=`<div class="adminCard"><h3>Phase descriptions</h3><div class="adminList">${DATA.phases.map(p=>`<div class="adminRow"><div class="field"><label>Phase ${p.phase}</label><textarea id="phaseDesc${p.phase}">${esc(SETTINGS.phaseDescriptions[String(p.phase)]??p.description)}</textarea></div></div>`).join('')}</div><div class="adminActions" style="margin-top:14px"><button class="btn" onclick="savePhaseDescriptions()">Save phase descriptions</button></div><div class="successText" id="phaseMsg"></div></div>`;
 } else if(section==='resources'){

function saveGeneral(){
 SETTINGS.brandName=(document.getElementById('admBrand').value.trim()||'STIFF').toUpperCase();
 SETTINGS.homeEyebrow=document.getElementById('admEyebrow').value;

 SETTINGS.homeEncouragement=document.getElementById('admEnc').value;
 saveSettings(); document.getElementById('admMsg').textContent='Saved.';
}
function savePhaseDescriptions(){
 DATA.phases.forEach(p=>SETTINGS.phaseDescriptions[String(p.phase)]=document.getElementById('phaseDesc'+p.phase).value);
 saveSettings(); document.getElementById('phaseMsg').textContent='Saved.';
}
function saveResourcesAdmin(){
 const controls=document.querySelectorAll('[data-rkey]');
 const staged={};
 controls.forEach(el=>{
   const k=el.dataset.rkey; staged[k]=staged[k]||{};
   if(el.dataset.kind==='hidden') staged[k].hidden=el.checked;
   else staged[k][el.dataset.kind]=el.value;
 });
 SETTINGS.resourceOverrides={...SETTINGS.resourceOverrides,...staged};
 saveSettings(); document.getElementById('resourceMsg').textContent='Saved.';
}
function resetProgress(){
 if(!confirm('Reset all course completion progress in this browser?'))return;
 Object.keys(completed).forEach(k=>delete completed[k]);save();alert('Progress reset.');

function factoryReset(){
 if(!confirm('Reset all Admin edits back to the defaults?'))return;

function downloadSettings(){
 const blob=new Blob([JSON.stringify(SETTINGS,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stiff-admin-settings.json';a.click();URL.revokeObjectURL(a.href);
}
function importSettings(){
 try{
   const incoming=JSON.parse(document.getElementById('importBox').value);
   SETTINGS={...DEFAULT_SETTINGS,...incoming,phaseDescriptions:{...DEFAULT_SETTINGS.phaseDescriptions,...(incoming.phaseDescriptions||{})},resourceOverrides:{...(incoming.resourceOverrides||{})}};
   saveSettings();document.getElementById('backupMsg').textContent='Imported successfully.';
 }catch(e){document.getElementById('backupMsg').textContent='That is not valid settings JSON.'}
}

function openResource(folder,p,startIndex=0){phase=p;openLesson(folder,p,startIndex)}
function openLesson(folder,p,startIndex=0){
 if(p) phase=p;
 const ph=DATA.phases.find(x=>x.phase===phase), item=ph.items.find(i=>i.folder===folder);
 lesson={folder,item,seq:DATA.screenSequences[folder]};
 idx=Math.max(0,Math.min(startIndex,lesson.seq.length-1));
 renderViewer();
}
function renderViewer(){
 const x=lesson.seq[idx], total=lesson.seq.length;
 let content=x.type==='image'?`<img class="screen" src="${thumb(x.id)}" alt="Screen ${x.n}">`:`<iframe class="media" src="${preview(x.id)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
 root.innerHTML=`<div class="viewerTop"><div class="viewerRow"><button class="close" onclick="${currentPage==='resources'?'resources()':'showPhase('+phase+')'}">×</button><div class="viewerName">${esc(lesson.item.title)}</div><div>▢</div></div><div class="viewerBar"><div style="width:${((idx+1)/total*100).toFixed(2)}%"></div></div></div><div class="viewerBody">${content}<div class="counter">${esc(x.name)} · ${idx+1} of ${total}</div></div><div class="viewerNav"><div class="viewerNavIn"><button class="btn back" onclick="prev()" ${idx===0?'style="visibility:hidden"':''}>← Back</button><button class="btn" onclick="next()">${idx===total-1?'Finish':'Continue'}</button></div></div>`;
 window.scrollTo(0,0);
}
function prev(){if(idx>0){idx--;renderViewer()}}
function next(){if(idx<lesson.seq.length-1){idx++;renderViewer()}else{completed[lesson.folder]=true;save();currentPage==='resources'?resources():showPhase(phase)}}
home();
