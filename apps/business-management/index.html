<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understanding Business Management</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid #283451;background:#10172a}header a{color:#fff;text-decoration:none;background:#1c2641;border:1px solid #344264;padding:10px 14px;border-radius:999px;display:inline-block;font-weight:800}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><header><a href="../../index.html">← 🏠 Confidence Hub</a><h1>💼 Understanding Business Management</h1><p>12 weeks to understand customers, finance, operations, people, strategy and how a business is managed.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and can be included in your Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "How Businesses Work", "time": "35 min \u00d7 3", "objective": "Understand value, customers, revenue, costs, profit and reinvestment.", "practice": "Map three businesses: customer \u2192 value \u2192 revenue \u2192 costs \u2192 profit."}, {"n": 2, "title": "Business Models", "time": "40 min \u00d7 3", "objective": "Learn B2C, B2B, service, subscription, marketplace and recurring-revenue models.", "practice": "Choose three companies and identify model, payer, delivery method and recurring revenue."}, {"n": 3, "title": "Customers & Value", "time": "45 min \u00d7 3", "objective": "Understand customer problems, segments and value propositions.", "practice": "Write five customer problems; conduct three short customer conversations; avoid pitching."}, {"n": 4, "title": "Business Finance", "time": "45 min \u00d7 4", "objective": "Understand revenue, gross profit, expenses, net profit, cash flow and break-even.", "practice": "Build a simple monthly P&L and cash-flow example using fictional numbers."}, {"n": 5, "title": "Marketing", "time": "45 min \u00d7 3", "objective": "Learn positioning, channels, funnels, acquisition and retention.", "practice": "Create one customer profile, one offer and a simple awareness\u2192enquiry\u2192sale funnel."}, {"n": 6, "title": "Sales", "time": "40 min \u00d7 3", "objective": "Understand prospecting, discovery, proposal, objections, close and follow-up.", "practice": "Write discovery questions; practise a 5-minute sales conversation; draft follow-up."}, {"n": 7, "title": "Operations", "time": "45 min \u00d7 3", "objective": "Learn processes, SOPs, capacity, quality and bottlenecks.", "practice": "Document one real process as an SOP; identify the slowest step; propose one improvement."}, {"n": 8, "title": "Managing People", "time": "45 min \u00d7 3", "objective": "Study hiring, delegation, feedback, accountability and performance.", "practice": "Design three roles with responsibilities, outcomes and simple KPIs."}, {"n": 9, "title": "Leadership & Decisions", "time": "40 min \u00d7 3", "objective": "Separate management from leadership and improve decision quality.", "practice": "Keep a decision journal: decision, assumptions, risks, outcome and lesson."}, {"n": 10, "title": "Strategy & Competition", "time": "50 min \u00d7 3", "objective": "Understand differentiation, competitive advantage, pricing and trade-offs.", "practice": "Complete a SWOT for one real business and explain why customers choose it."}, {"n": 11, "title": "Growth", "time": "45 min \u00d7 3", "objective": "Learn retention, referrals, systems, automation, hiring and scaling constraints.", "practice": "Ask what breaks at 2\u00d7 and 10\u00d7 demand; design fixes for the first three bottlenecks."}, {"n": 12, "title": "Management Playbook", "time": "60 min \u00d7 3", "objective": "Combine everything into a practical management system.", "practice": "Create a one-page plan covering model, customer, offer, finance, marketing, operations, people, KPIs and 90-day goals."}]; const KEY='plan_business-management_done'; let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}
function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
