<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meditation &amp; Presence</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid #283451;background:#10172a}header a{color:var(--m);text-decoration:none}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><header><a href="../../index.html">← Confidence Hub</a><h1>🧘 Meditation &amp; Presence</h1><p>12 weeks to build mindfulness, attention, emotional awareness and a calmer relationship with your thoughts.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and can be included in your Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "Learning to Stop", "time": "5 min/day", "objective": "Learn what mindfulness is; practise five minutes of breath awareness daily.", "practice": "5-minute breath meditation; one 60-second pause; note one moment you were on autopilot."}, {"n": 2, "title": "Training Attention", "time": "7 min/day", "objective": "Practise returning attention without judging yourself.", "practice": "7-minute breath meditation; count 10 breaths; restart gently whenever attention wanders."}, {"n": 3, "title": "Body Awareness", "time": "10 min/day", "objective": "Notice physical sensations and tension earlier.", "practice": "10-minute body scan; three posture/tension check-ins; relax jaw and shoulders."}, {"n": 4, "title": "Watching Thoughts", "time": "10 min/day", "objective": "Observe thoughts as mental events rather than commands.", "practice": "Label thoughts \u201cplanning\u201d, \u201cworrying\u201d, or \u201cremembering\u201d; return to breath; journal one recurring thought."}, {"n": 5, "title": "Emotional Awareness", "time": "10\u201312 min/day", "objective": "Recognise emotions without immediately reacting to them.", "practice": "Name the emotion; locate it in the body; rate intensity 1\u201310; wait before acting."}, {"n": 6, "title": "Present With People", "time": "12 min/day", "objective": "Listen without rehearsing your next sentence.", "practice": "One phone-free conversation daily; notice tone/body language; summarise what the person actually said."}, {"n": 7, "title": "Mindful Everyday Life", "time": "12\u201315 min/day", "objective": "Bring awareness into ordinary activities.", "practice": "Choose three: shower, meal, walk, commute, cleaning; do them without extra stimulation."}, {"n": 8, "title": "Reducing Reactivity", "time": "15 min/day", "objective": "Create space between trigger and response.", "practice": "Use a 3-second pause; take one slow breath; choose the next action deliberately."}, {"n": 9, "title": "Acceptance", "time": "15 min/day", "objective": "Allow discomfort without immediately escaping or fixing it.", "practice": "Sit with one mild discomfort; describe sensations neutrally; distinguish acceptance from giving up."}, {"n": 10, "title": "Digital Presence", "time": "15 min/day + 30 min offline", "objective": "Reduce automatic stimulation and attention switching.", "practice": "30-minute phone-free block; disable one unnecessary notification; single-task one activity."}, {"n": 11, "title": "Longer Meditation", "time": "20 min/day", "objective": "Build sustained practice and explore different meditation styles.", "practice": "Alternate breath, body, walking and open-awareness meditation; record which helps most."}, {"n": 12, "title": "Living Presently", "time": "20 min/day", "objective": "Turn presence into a sustainable way of living.", "practice": "Design permanent routine; review triggers; choose three presence rules for the next 90 days."}]; const KEY='plan_meditation-presence_done'; let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}
function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
