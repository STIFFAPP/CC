<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understanding Stoicism</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid #283451;background:#10172a}header a{color:#fff;text-decoration:none;background:#1c2641;border:1px solid #344264;padding:10px 14px;border-radius:999px;display:inline-block;font-weight:800}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><header><a href="../../index.html">← 🏠 Confidence Hub</a><h1>🏛️ Understanding Stoicism</h1><p>12 weeks to study Stoic philosophy and turn its ideas into practical habits without confusing Stoicism with suppressing emotion.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and can be included in your Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "What Stoicism Is", "time": "30 min \u00d7 3", "objective": "Study virtue, reason and the four cardinal virtues: wisdom, courage, justice and temperance.", "practice": "Read a short primary-source passage; define each virtue; ask \u201cWhat would good character look like here?\u201d"}, {"n": 2, "title": "Control", "time": "30 min \u00d7 3", "objective": "Learn the Stoic distinction between your choices and things you do not fully control.", "practice": "Make two columns: within my control / outside my control; redirect effort to the first."}, {"n": 3, "title": "Judgments & Reactions", "time": "30 min \u00d7 3", "objective": "Separate an event from the interpretation you add to it.", "practice": "Journal: what happened \u2192 my judgment \u2192 alternative judgment \u2192 chosen response."}, {"n": 4, "title": "Virtue Over Validation", "time": "30 min \u00d7 3", "objective": "Examine reputation, comparison and approval seeking.", "practice": "Do one worthwhile thing without announcing it; notice when reputation changes your choice."}, {"n": 5, "title": "Emotion & Response", "time": "30 min \u00d7 3", "objective": "Understand that Stoicism does not require being emotionless.", "practice": "Name the first emotional reaction; pause; choose behaviour consistent with your values."}, {"n": 6, "title": "Voluntary Discomfort", "time": "25 min \u00d7 3", "objective": "Use mild, safe inconvenience to practise resilience and gratitude.", "practice": "Choose a simple meal, a walk instead of convenience, or a short entertainment-free period; never use unsafe deprivation."}, {"n": 7, "title": "Negative Visualisation", "time": "25 min \u00d7 3", "objective": "Use brief reflection on impermanence to increase appreciation.", "practice": "Consider one thing you take for granted, then write how you will appreciate it today."}, {"n": 8, "title": "Difficult People", "time": "30 min \u00d7 3", "objective": "Apply Stoic ideas to disagreement, insults and frustration.", "practice": "Ask \u201cWhat response represents my character?\u201d; practise calm boundaries instead of retaliation."}, {"n": 9, "title": "Amor Fati", "time": "30 min \u00d7 3", "objective": "Practise accepting reality as the starting point for useful action.", "practice": "Write: \u201cGiven that this happened, what can I do with it now?\u201d"}, {"n": 10, "title": "Memento Mori", "time": "25 min \u00d7 3", "objective": "Use mortality to clarify priorities rather than create fear.", "practice": "Review one day of time use; remove one low-value habit; choose one meaningful action."}, {"n": 11, "title": "View From Above", "time": "25 min \u00d7 3", "objective": "Use perspective to reduce unnecessary self-importance without dismissing real problems.", "practice": "Mentally zoom from self \u2192 street \u2192 city \u2192 Earth \u2192 time; then return to the next useful action."}, {"n": 12, "title": "Your Stoic Code", "time": "45 min \u00d7 3", "objective": "Integrate the philosophy into a personal code.", "practice": "Write a one-page code; select five principles; design morning and evening reflection routines."}]; const KEY='plan_stoicism_done'; let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}
function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
