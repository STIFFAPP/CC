<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinematic Camera &amp; Visual Storytelling</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}.hubhome{position:fixed;z-index:999;top:12px;left:12px;padding:10px 14px;border-radius:999px;background:#151d33ee;border:1px solid #344264;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 30px #0007}header{padding:76px 20px 28px;border-bottom:1px solid #283451;background:#10172a}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px;line-height:1.55}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><a class="hubhome" href="../../index.html">← 🏠 Hub</a><header><h1>🎥 Cinematic Camera &amp; Visual Storytelling</h1><p>12 weeks of camera, lighting, movement, sound and cinematic sequencing designed to support your YouTube storytelling.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and included in Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "Camera Foundations", "time": "45\u201360 min, 3x/week", "objective": "Understand exposure, shutter speed, aperture, ISO, white balance and frame rate as storytelling choices.", "practice": "Shoot the same 10-second subject at different exposure settings. Practise a natural 24/25fps look and review motion, noise and depth of field."}, {"n": 2, "title": "Composition With Intention", "time": "45\u201360 min, 3x/week", "objective": "Use framing, headroom, leading lines, negative space and layers to direct attention.", "practice": "Shoot 20 frames of one location: wide, medium, close, symmetrical, layered and negative-space versions. Explain what each frame makes you notice."}, {"n": 3, "title": "Shot Sizes & Visual Grammar", "time": "60 min, 3x/week", "objective": "Know when wides establish, mediums explain and close-ups reveal detail/emotion.", "practice": "Film a simple task using establishing wide, medium action, close-up, insert and reaction. Edit it without dialogue so the action is understandable."}, {"n": 4, "title": "Lenses, Distance & Perspective", "time": "60 min, 3x/week", "objective": "Understand how focal length and camera distance change space, faces and emotional proximity.", "practice": "Shoot the same subject wide/close and long/far while keeping similar framing. Compare background compression and emotional feel."}, {"n": 5, "title": "Camera Movement", "time": "60\u201375 min, 3x/week", "objective": "Use static shots, pans, tilts, push-ins, tracking and handheld movement only when motivated.", "practice": "Film six 10-second moves. Repeat each slowly. Create a 30-second sequence where every movement has a reason."}, {"n": 6, "title": "Natural Light", "time": "60 min, 3x/week", "objective": "Recognise direction, softness, contrast and colour before adding equipment.", "practice": "Film one face near a window from front, side and backlight positions. Use curtains/reflective surfaces to shape the result."}, {"n": 7, "title": "Lighting a Scene", "time": "60\u201390 min, 3x/week", "objective": "Build simple key, fill and background separation while maintaining a believable mood.", "practice": "Create three looks with the lights you own: clean interview, moody side light and practical-light scene. Photograph/record settings for repeatability."}, {"n": 8, "title": "B-Roll That Tells the Story", "time": "60\u201390 min, 3x/week", "objective": "Capture evidence, process, detail, environment and reaction instead of decorative filler.", "practice": "For one YouTube story create a 15-shot B-roll list tied to specific script lines. Capture wide/medium/tight coverage and cut a 45-second sequence."}, {"n": 9, "title": "Clean Audio & Atmosphere", "time": "60 min, 3x/week", "objective": "Treat dialogue, room tone and environmental sound as part of cinematic storytelling.", "practice": "Record dialogue at 3 mic distances, capture 30 seconds of room tone and 10 useful natural sounds. Build a scene using sound before music."}, {"n": 10, "title": "Continuity & Coverage", "time": "60\u201390 min, 3x/week", "objective": "Shoot enough angles and maintain screen direction/action continuity so edits feel invisible.", "practice": "Film a person entering, sitting and completing a task with master, medium, close and inserts. Edit without jumpy action or direction changes."}, {"n": 11, "title": "Colour, Rhythm & The Cinematic Sequence", "time": "90 min, 2\u20133x/week", "objective": "Keep exposure/white balance consistent and use restrained correction plus editing rhythm to create a coherent look.", "practice": "Match 5 clips for exposure and white balance. Build a 60-second sequence with purposeful shot duration; make a second cut with a different emotional rhythm."}, {"n": 12, "title": "Capstone: Film the Storytelling Video", "time": "3\u20135 hrs across week", "objective": "Combine camera language with the final YouTube Storytelling project.", "practice": "Create a shot map from the storytelling script, film A-roll and motivated B-roll, capture clean sound, edit a 2\u20135 minute cinematic sequence, then review whether every visual advances story, emotion or information."}];const KEY='plan_cinematic-camera_done';let done=JSON.parse(localStorage.getItem(KEY)||'{}');function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
