<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tax Evasion, Compliance &amp; Legal Tax Planning</title><style>
:root{--bg:#0b1020;--p:#151d33;--p2:#1c2641;--t:#f5f7ff;--m:#aeb8d6;--a:#8b9cff;--g:#65d6a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:28px 20px;border-bottom:1px solid #283451;background:#10172a}header a{color:var(--m);text-decoration:none}header h1{margin:14px 0 8px;font-size:clamp(30px,6vw,52px)}header p{max-width:780px;color:var(--m);line-height:1.6}main{max-width:1000px;margin:auto;padding:22px}.progress{height:9px;background:#202b48;border-radius:9px;overflow:hidden;margin:20px 0}.progress i{display:block;height:100%;background:var(--g);width:0}.weeks{display:grid;gap:13px}.week{background:var(--p);border:1px solid #283451;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start}.badge{color:var(--a);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h2{margin:5px 0 9px}.time{font-size:12px;color:var(--g);font-weight:800;white-space:nowrap}p{line-height:1.55}.obj{color:var(--m)}.practice{background:var(--p2);padding:12px;border-radius:12px}label{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:800}input{width:19px;height:19px;accent-color:var(--g)}.note{font-size:12px;color:var(--m);margin-top:18px}@media(max-width:560px){main{padding:12px}.week{padding:14px}.top{display:block}.time{display:block;margin-top:6px}}
</style></head><body><header><a href="../../index.html">← Confidence Hub</a><h1>🧾 Tax Evasion, Compliance &amp; Legal Tax Planning</h1><p>12 weeks to understand tax evasion, recognise risky behaviour, keep better records and distinguish illegal evasion from lawful tax planning.</p><div class="progress"><i id="bar"></i></div><div id="count"></div></header><main><div class="weeks" id="weeks"></div><p class="note">Progress is stored on this device and can be included in your Hub sync where supported.</p></main><script>
const DATA=[{"n": 1, "title": "Evasion vs Legal Planning", "time": "35 min \u00d7 3", "objective": "Understand the difference between illegal concealment/misrepresentation, lawful tax planning and ordinary compliance.", "practice": "Classify fictional scenarios as compliance, legal planning or potential evasion; explain why. Do not practise concealment."}, {"n": 2, "title": "How Tax Systems Work", "time": "40 min \u00d7 3", "objective": "Learn the roles of income, expenses, records, returns, payments and tax authorities.", "practice": "Draw the flow from transaction \u2192 record \u2192 accounts \u2192 return \u2192 payment."}, {"n": 3, "title": "Records & Evidence", "time": "30 min \u00d7 4", "objective": "Understand why invoices, receipts, bank records and audit trails matter.", "practice": "Create a mock filing system; reconcile ten fictional transactions to supporting documents."}, {"n": 4, "title": "Business Income", "time": "40 min \u00d7 3", "objective": "Understand the principle that business income needs to be recorded accurately.", "practice": "Use fictional sales to build a complete sales ledger; identify missing references or gaps."}, {"n": 5, "title": "Business Expenses", "time": "40 min \u00d7 3", "objective": "Learn to separate genuine business costs from personal spending and unsupported claims.", "practice": "Classify fictional expenses; flag ambiguous items for professional advice rather than guessing."}, {"n": 6, "title": "Cash & Hidden-Income Risks", "time": "35 min \u00d7 3", "objective": "Understand why unrecorded cash sales and deliberate omissions are serious compliance risks.", "practice": "Reconcile a fictional cashbook against deposits and invoices; practise finding discrepancies, not hiding them."}, {"n": 7, "title": "False Documents & Misrepresentation", "time": "35 min \u00d7 3", "objective": "Recognise false invoices, fabricated expenses and misleading records as red flags.", "practice": "Review fictional records and identify inconsistencies that should be corrected or escalated."}, {"n": 8, "title": "Payroll & Contractors", "time": "40 min \u00d7 3", "objective": "Understand that worker status, payroll and contractor records require accurate treatment.", "practice": "Create a checklist of information to collect; mark uncertain classifications for accountant/HMRC guidance."}, {"n": 9, "title": "VAT & Indirect-Tax Awareness", "time": "40 min \u00d7 3", "objective": "Understand the basic purpose of VAT/indirect tax and why registration/reporting rules matter.", "practice": "Map a fictional sale and purchase through a VAT record; verify current rules with HMRC before real decisions."}, {"n": 10, "title": "Investigations & Corrections", "time": "35 min \u00d7 3", "objective": "Understand audits, enquiries, voluntary correction and the importance of cooperation and professional advice.", "practice": "Run a mock internal review: identify an error, document it, preserve records and list who to contact."}, {"n": 11, "title": "Lawful Tax Efficiency", "time": "40 min \u00d7 3", "objective": "Learn that legitimate planning relies on real transactions, accurate facts and rules\u2014not concealment.", "practice": "List questions for a qualified accountant about allowable costs, structure and reliefs; verify current HMRC guidance."}, {"n": 12, "title": "Compliance System", "time": "60 min \u00d7 2", "objective": "Build a repeatable system that reduces mistakes and risky shortcuts.", "practice": "Create monthly bookkeeping, reconciliation, document-retention and accountant-review checklists."}]; const KEY='plan_tax-compliance_done'; let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function render(){document.getElementById('weeks').innerHTML=DATA.map(w=>`<section class="week"><div class="top"><div><div class="badge">Week ${w.n}</div><h2>${w.title}</h2></div><span class="time">${w.time}</span></div><p class="obj">${w.objective}</p><div class="practice"><b>Practice:</b> ${w.practice}</div><label><input type="checkbox" data-n="${w.n}" ${done[w.n]?'checked':''}> Week complete</label></section>`).join('');document.querySelectorAll('input').forEach(x=>x.onchange=()=>{done[x.dataset.n]=x.checked;localStorage.setItem(KEY,JSON.stringify(done));renderProgress()});renderProgress()}
function renderProgress(){const n=DATA.filter(w=>done[w.n]).length;document.getElementById('bar').style.width=(n/DATA.length*100)+'%';document.getElementById('count').textContent=`${n} / 12 weeks complete`;}render();
</script></body></html>
