<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Confidence Hub</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#f7f8ff;font:14px system-ui,-apple-system,sans-serif}a,button{touch-action:manipulation}.wrap{max-width:900px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center}.muted{color:#aeb8d1}h1{font-size:27px;margin:18px 0 4px}.today{margin:16px 0;padding:15px;border:1px solid #354064;border-radius:19px;background:#151d33}.today b{display:block;font-size:18px;margin:5px 0}.primary{display:inline-flex;margin-top:10px;padding:10px 13px;border-radius:12px;background:#8b9cff;color:white;text-decoration:none;font-weight:800}.section{margin-top:22px}.section h2{font-size:16px;margin:0 0 10px}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.app{min-width:0;min-height:105px;border:1px solid #293453;background:#141b2d;border-radius:17px;padding:10px 5px;color:#fff;text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}.app:active{transform:scale(.96);background:#1c2742}.icon{font-size:27px;margin-bottom:7px}.name{font-size:10.5px;font-weight:800;line-height:1.12;overflow-wrap:anywhere}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.lib{min-height:82px;padding:11px 7px;border-radius:15px;border:1px solid #293453;background:#11182a;color:#fff;text-decoration:none;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:22px}.lib b{display:block;margin-top:5px;font-size:9.5px}.account{width:40px;height:40px;border-radius:50%;border:1px solid #293453;background:#141b2d;color:#fff}.status{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#202b49;border:1px solid #53618d;padding:9px 13px;border-radius:12px;display:none;z-index:50}@media(max-width:430px){.wrap{padding-left:9px;padding-right:9px}.apps{gap:5px}.app{min-height:86px;border-radius:14px;padding:7px 3px}.icon{font-size:22px;margin-bottom:5px}.name{font-size:9px}.library{gap:5px}.lib{min-height:70px;padding:8px 4px;font-size:19px}.lib b{font-size:8.5px}h1{font-size:24px}}</style></head><body><div class="wrap"><header><div><strong>CONFIDENCE HUB</strong><div class="muted">Your app hub</div></div><button class="account" type="button" aria-label="Account">👤</button></header><h1>Today</h1><div class="muted">Quick access to the apps you use most.</div><section class="today"><span class="muted">TODAY'S FOCUS</span><b>🎯 Start & Finish</b><span class="muted">Open your current 12-week practice.</span><br><a class="primary nav" data-path="apps/start-and-finish/index.html" href="./apps/start-and-finish/index.html">Open today's focus →</a></section><section class="section"><h2>Quick access</h2><div class="apps" id="quick"></div></section><section class="section"><h2>App Library</h2><div class="library" id="library"></div></section></div><div class="status" id="status">Opening…</div><script>
const quick=[['⚡','STIFF','apps/stiff/index.html'],['🧭','Life Manager','apps/life-manager/index.html'],['🏋️','Workout','apps/workout/index.html'],['📈','Eden CRM','apps/eden-commercial-crm/index.html'],['💼','Business','apps/business/index.html'],['🧘','Meditation','apps/meditation-presence/index.html'],['🏛️','Stoicism','apps/stoicism/index.html'],['🌿','Eden Ads','apps/eden-advertising/index.html']];
const library=[['🌱','Recovery','apps/recovery/index.html'],['🎯','Start & Finish','apps/start-and-finish/index.html'],['📊','Business Mgmt','apps/business-management/index.html'],['🧾','Tax & Compliance','apps/tax-compliance/index.html'],['🎬','YouTube','apps/youtube-storytelling/index.html'],['🎥','Cinematic','apps/cinematic-camera/index.html'],['📁','Project HQ','apps/project-hq/index.html'],['🛍️','Outlet Vault','apps/outlet-vault/index.html']];
function urlFor(path){const u=new URL(location.href);let base=u.pathname;const i=base.lastIndexOf('/');base=base.slice(0,i+1);return u.origin+base+path}
function openApp(path){const s=document.getElementById('status');s.style.display='block';location.assign(urlFor(path))}
function appTile([icon,name,path]){const a=document.createElement('a');a.className='app';a.href=urlFor(path);a.innerHTML='<span class="icon">'+icon+'</span><span class="name">'+name+'</span>';a.addEventListener('click',e=>{e.preventDefault();openApp(path)});return a}
function libTile([icon,name,path]){const a=document.createElement('a');a.className='lib';a.href=urlFor(path);a.innerHTML='<span>'+icon+'</span><b>'+name+'</b>';a.addEventListener('click',e=>{e.preventDefault();openApp(path)});return a}
quick.forEach(x=>document.getElementById('quick').appendChild(appTile(x)));library.forEach(x=>document.getElementById('library').appendChild(libTile(x)));document.querySelectorAll('.nav').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openApp(a.dataset.path)}));
</script></body></html>
